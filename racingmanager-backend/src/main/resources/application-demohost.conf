include classpath("application.conf")

racingmanager {
    profile = "prod"
    mode = "hosted"
    # Distinct from the default local-mode db file — a hosted deployment must
    # never share state with an offline/local install run from the same checkout.
    database.path = "./.data/racingmanager-demohost.db"
    jwt.keys = [
        {
            kid = "default_key"
            algorithm = "RS256"
            secret = "0c584466-0180-4bcb-920e-a9437ceecbd0"
            active = true
        }
    ]
}
