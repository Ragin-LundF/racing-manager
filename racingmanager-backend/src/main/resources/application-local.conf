include classpath("application.conf")

racingmanager {
    profile = "prod"
    mode = "local"
    # Own database file. The hosted demo profile runs from the same checkout
    # against ./.data/racingmanager-demohost.db; sharing that file would give a
    # supposedly fresh local install someone else's users, which in turn closes
    # first-run registration (`409 ALREADY_SETUP`) before it was ever used.
    # The `${?...}` line keeps RACINGMANAGER_DB_PATH able to override this — a
    # bare literal silently wins over the one inherited from application.conf.
    database.path = "./.data/racingmanager-local.db"
    database.path = ${?RACINGMANAGER_DB_PATH}
    # No `jwt.keys` here on purpose: in local mode the signing key is generated
    # and persisted on first run, and this section is never read.
}
