ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ io.github.raginlundf.racingmanager.ApplicationKt.module ]
    }
}

racingmanager {
    # Application profile. "demo" seeds a default admin (admin/admin) on first run.
    # Change to e.g. "prod" (or set RACINGMANAGER_PROFILE) to disable seeding.
    profile = "demo"
    profile = ${?RACINGMANAGER_PROFILE}

    # Deployment mode: "local" (single implicit tenant, no cloud dependency) or
    # "hosted" (multi-tenant, centrally managed signing keys). Defaults to "local"
    # so existing offline installations are unaffected. Set via RACINGMANAGER_MODE.
    mode = "local"
    mode = ${?RACINGMANAGER_MODE}

    # Database. By default an embedded SQLite file is used (ideal for local /
    # offline installs). Set `url` to a JDBC URL (e.g. MariaDB) to switch — the
    # driver is inferred from the URL prefix. For hosted deployments supply the
    # URL and credentials via environment variables only; never commit them.
    database {
        # SQLite file location. Ignored when `url` is set. Falls back to
        # ~/.racingmanager/racingmanager.db when unset.
        path = ${?RACINGMANAGER_DB_PATH}
        # e.g. jdbc:mariadb://localhost:3306/racingmanager
        url = ${?RACINGMANAGER_DB_URL}
        user = ${?RACINGMANAGER_DB_USER}
        password = ${?RACINGMANAGER_DB_PASSWORD}
    }

    # Race timing device. "simulated" runs an in-process fake Raspberry Pi (no
    # hardware, deterministic) — the default so dev/offline installs just work.
    # "hardware" connects to a real Raspberry Pi over the WebSocket "endpoint".
    # "arduino_two_lane" talks to an Arduino two-lane light barrier on a local
    # serial port (see .plan/Adruino-impl.md). finishTimeoutMs is the per-lane
    # deadline after which a lane counts as DNF, whatever the mode.
    racedevice {
        mode = "simulated"
        mode = ${?RACINGMANAGER_RACEDEVICE_MODE}
        endpoint = "ws://raspberrypi.local:8080/race"   # read only when mode = "hardware"
        endpoint = ${?RACINGMANAGER_RACEDEVICE_ENDPOINT}
        finishTimeoutMs = 30000
        finishTimeoutMs = ${?RACINGMANAGER_RACEDEVICE_FINISH_TIMEOUT_MS}

        # Read only when mode = "arduino_two_lane". Defaults are the suggested
        # values from .plan/Adruino-impl.md §7.1. The port name has no default —
        # it differs per machine (COM3, /dev/tty.usbmodem*, /dev/ttyACM*) and is
        # normally picked in the UI.
        arduino {
            portName = ""
            portName = ${?RACINGMANAGER_RACEDEVICE_ARDUINO_PORT}
            baudRate = 115200
            baudRate = ${?RACINGMANAGER_RACEDEVICE_ARDUINO_BAUD_RATE}
            readyTimeoutMs = 10000
            readyTimeoutMs = ${?RACINGMANAGER_RACEDEVICE_ARDUINO_READY_TIMEOUT_MS}
            # 0 disables the false-start check: on the observed board START fires
            # 4-8 ms after every ARM while the finish times are valid, so any
            # window would reject every real heat. A finish with no measured time
            # is rejected regardless — that is the actual sensor-fault signature.
            falseStartWindowMs = 0
            falseStartWindowMs = ${?RACINGMANAGER_RACEDEVICE_ARDUINO_FALSE_START_WINDOW_MS}
            # ELAPSED: the FINISH value is already the elapsed time in ms —
            # established from a real capture (nine measurements, each matching the
            # host-side interval within 40 ms). TIMESTAMP (finish - start) remains
            # available for a board build that reports a millis() timestamp.
            finishSemantics = "ELAPSED"
            finishSemantics = ${?RACINGMANAGER_RACEDEVICE_ARDUINO_FINISH_SEMANTICS}
            rawLogPath = "raw-timing.log"
            rawLogPath = ${?RACINGMANAGER_RACEDEVICE_ARDUINO_RAW_LOG_PATH}
        }
    }

    # Background purge of soft-deleted tenants. A supervisor "delete" only marks a
    # tenant PENDING_DELETION; this worker hard-deletes it (and all its data) once it
    # has been pending longer than `retention`. Until then a supervisor can reactivate
    # it (POST /api/v1/admin/tenants/{id}/reactivate). Durations use Kotlin format
    # ("24h", "1h", "30m"). Set enabled = false to turn the worker off.
    tenantPurge {
        retention = "24h"
        retention = ${?RACINGMANAGER_TENANT_PURGE_RETENTION}
        interval = "1h"
        interval = ${?RACINGMANAGER_TENANT_PURGE_INTERVAL}
        enabled = true
        enabled = ${?RACINGMANAGER_TENANT_PURGE_ENABLED}
    }

    jwt.keys = [
        {
            kid = "default_key"
            algorithm = "RS256"
            secret = "0c584466-0180-4bcb-920e-a9437ceecbd0"
            active = true
        }
    ]
    # Required only when mode = "hosted": JWT signing keys, managed by the
    # deployment pipeline rather than generated in-process. Not read in "local"
    # mode. Load this via a separate config file passed with `-config=`. Each
    # entry is either an RSA key pair (RS256) or a shared secret (HS256):
    #
    # racingmanager.jwt.keys = [
    #   {
    #     kid = "2026-01"                # key identifier carried in the JWT header
    #     algorithm = "RS256"            # optional, defaults to RS256
    #     publicKey = "<base64 X.509 SubjectPublicKeyInfo DER>"
    #     privateKey = "<base64 PKCS8 PrivateKeyInfo DER>"  # omit on retired keys kept only for verification
    #     active = true                  # exactly one key must be active with signing material
    #   }
    # ]
    #
    # racingmanager.jwt.keys = [
    #   {
    #     kid = "2026-01"
    #     algorithm = "HS256"            # optional, defaults to HS256 when "secret" is set
    #     secret = "<random string, 32+ bytes recommended>"
    #     active = true
    #   }
    # ]
    #
    # A shared secret is simpler to operate for a single-instance deployment,
    # but every verifier needs the same secret (there is no public/private
    # split, so a key can't be retired to verification-only the way an RSA
    # key can).
    #
    # See README.md ("Getting started — hosted (SaaS) setup") for how to generate
    # a compatible RSA key pair with openssl, or a random secret.
}
