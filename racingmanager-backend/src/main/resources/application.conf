ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ io.github.raginlundf.racingmanager.ApplicationKt.module ]
    }
}

racingmanager {
    # Application profile. "demo" seeds a default admin (admin/admin) on first run.
    # Change to e.g. "prod" (or set RACINGMANAGER_PROFILE) to disable seeding.
    profile = "demo"
    profile = ${?RACINGMANAGER_PROFILE}

    # Deployment mode: "local" (single implicit tenant, no cloud dependency) or
    # "hosted" (multi-tenant, centrally managed signing keys). Defaults to "local"
    # so existing offline installations are unaffected. Set via RACINGMANAGER_MODE.
    mode = "local"
    mode = ${?RACINGMANAGER_MODE}

    jwt.keys = [
        {
            kid = "default_key"
            algorithm = "RS256"
            secret = "0c584466-0180-4bcb-920e-a9437ceecbd0"
            active = true
        }
    ]
    # Required only when mode = "hosted": JWT signing keys, managed by the
    # deployment pipeline rather than generated in-process. Not read in "local"
    # mode. Load this via a separate config file passed with `-config=`. Each
    # entry is either an RSA key pair (RS256) or a shared secret (HS256):
    #
    # racingmanager.jwt.keys = [
    #   {
    #     kid = "2026-01"                # key identifier carried in the JWT header
    #     algorithm = "RS256"            # optional, defaults to RS256
    #     publicKey = "<base64 X.509 SubjectPublicKeyInfo DER>"
    #     privateKey = "<base64 PKCS8 PrivateKeyInfo DER>"  # omit on retired keys kept only for verification
    #     active = true                  # exactly one key must be active with signing material
    #   }
    # ]
    #
    # racingmanager.jwt.keys = [
    #   {
    #     kid = "2026-01"
    #     algorithm = "HS256"            # optional, defaults to HS256 when "secret" is set
    #     secret = "<random string, 32+ bytes recommended>"
    #     active = true
    #   }
    # ]
    #
    # A shared secret is simpler to operate for a single-instance deployment,
    # but every verifier needs the same secret (there is no public/private
    # split, so a key can't be retired to verification-only the way an RSA
    # key can).
    #
    # See README.md ("Getting started — hosted (SaaS) setup") for how to generate
    # a compatible RSA key pair with openssl, or a random secret.
}
