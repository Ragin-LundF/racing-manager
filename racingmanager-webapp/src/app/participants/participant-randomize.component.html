<div class="participant-randomize">
  <h2>{{ 'participants.randomize.title' | translate }}</h2>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (result(); as r) {
    <p class="success">{{ 'participants.randomize.success' | translate: { seed: r.seed } }}</p>
    <div class="actions">
      <button (click)="router.navigate(['..'], { relativeTo: route })">{{ 'participants.randomize.back' | translate }}</button>
    </div>
  } @else {
    <p>{{ 'participants.randomize.hint' | translate }}</p>
    <div class="actions">
      <button class="primary" (click)="onRandomize()" [disabled]="loading()">
        {{ (loading() ? 'participants.randomize.loading' : 'participants.randomize.start') | translate }}
      </button>
      <button (click)="router.navigate(['..'], { relativeTo: route })">{{ 'participants.randomize.cancel' | translate }}</button>
    </div>
  }
</div>
