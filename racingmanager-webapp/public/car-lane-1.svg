<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-label="Lane 1 car">
  <defs>
    <linearGradient id="l1-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a92db"/>
      <stop offset="1" stop-color="#12558f"/>
    </linearGradient>
    <radialGradient id="l1-rim" cx="0.38" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="0.65" stop-color="#aab4c0"/>
      <stop offset="1" stop-color="#5f6a76"/>
    </radialGradient>
  </defs>

  <ellipse cx="212" cy="168" rx="168" ry="15" fill="#000" opacity="0.28"/>

  <!-- wedge body: tall square rear (left), tapering to a low pointed nose (right) -->
  <path d="M62 134 L62 84 C62 74 70 68 80 68 L150 66 L360 118
           C367 120 367 128 360 130 L62 134 Z"
        fill="url(#l1-body)" stroke="#0c3560" stroke-width="2" stroke-linejoin="round"/>

  <!-- top-deck highlight -->
  <path d="M80 68 L150 66 L360 118 L354 122 L150 72 L83 74 Z" fill="#63acea" opacity="0.85"/>

  <!-- cockpit scoop -->
  <rect x="112" y="74" width="70" height="16" rx="8" fill="#0c3560" opacity="0.85"/>

  <!-- white racing swoosh -->
  <path d="M78 98 L150 88 L344 116 L340 127 L150 100 L80 108 Z" fill="#f5f7fa"/>

  <!-- number roundel -->
  <circle cx="214" cy="107" r="19" fill="#f5f7fa"/>
  <circle cx="214" cy="107" r="19" fill="none" stroke="#12558f" stroke-width="2"/>
  <path d="M217 96 l-9 14 h6 l-3 10 12 -16 h-6 z" fill="#12558f"/>

  <!-- wheels -->
  <g>
    <circle cx="122" cy="150" r="29" fill="#101318"/>
    <circle cx="122" cy="150" r="29" fill="none" stroke="#2f3843" stroke-width="3"/>
    <circle cx="122" cy="150" r="13" fill="url(#l1-rim)"/>
    <circle cx="122" cy="150" r="3.5" fill="#3a4450"/>
    <circle cx="306" cy="150" r="29" fill="#101318"/>
    <circle cx="306" cy="150" r="29" fill="none" stroke="#2f3843" stroke-width="3"/>
    <circle cx="306" cy="150" r="13" fill="url(#l1-rim)"/>
    <circle cx="306" cy="150" r="3.5" fill="#3a4450"/>
  </g>
</svg>
