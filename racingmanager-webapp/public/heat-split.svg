<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c5a97"/>
      <stop offset="0.5" stop-color="#123f6d"/>
      <stop offset="1" stop-color="#0b2848"/>
    </linearGradient>
    <linearGradient id="red" x1="1" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#9a2830"/>
      <stop offset="0.5" stop-color="#7a1f25"/>
